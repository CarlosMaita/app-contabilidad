# Despliegue local en Docker Desktop: mismo stack que producción
# (nginx + php-fpm + PostgreSQL + Redis + worker + scheduler) pero sin
# Caddy/TLS. La app queda en http://localhost:8080.
#
#   docker compose -f docker-compose.local.yml up -d --build
#   docker compose -f docker-compose.local.yml exec app php artisan migrate --force
name: app-contabilidad-local

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    ports:
      - "8080:80"
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    image: app-contabilidad-app:local
    env_file: .env.docker
    volumes:
      - storage_local:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  queue:
    image: app-contabilidad-app:local
    command: php artisan queue:work redis --tries=3 --max-time=3600
    env_file: .env.docker
    volumes:
      - storage_local:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy

  scheduler:
    image: app-contabilidad-app:local
    command: php artisan schedule:work
    env_file: .env.docker
    volumes:
      - storage_local:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contabilidad
      POSTGRES_USER: contabilidad
      POSTGRES_PASSWORD: local-secret
    volumes:
      - db_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contabilidad -d contabilidad"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

volumes:
  db_local:
  storage_local:
